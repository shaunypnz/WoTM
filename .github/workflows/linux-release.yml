name: Linux release

# A vX-linux tag publishes a pre-release page with .github/release-notes.md. Source only: GitHub adds the source archives, and the
# game must be built from the player's own disc, so no binary is ever attached here.

on:
  push:
    tags:
      - "v*-linux"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sed "s/{{TAG}}/$TAG/g" .github/release-notes.md > notes.md
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag --prerelease --title "War of the Monsters Recompiled for Linux $TAG" --notes-file notes.md
